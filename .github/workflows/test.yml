name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          # Single source of truth: go.mod pins the toolchain version.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        # The tree is expected to stay gofmt-clean; main.go carries a
        # pre-existing license-comment exception that is excluded here.
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^main\.go$' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        # Concurrency-sensitive areas (scheduler, TUI event routing,
        # session/config atomic writes) are covered by race-enabled runs.
        run: go test -race ./...

      - name: Build Forcefield
        run: go build -v ./...

  sandbox-probe:
    name: Sandbox probe • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Read-only capability probe (P0-E): prints kernel/LSM/userns facts
      # via the boundarytest probe so CI logs show why boundary tests run
      # or skip. No isolation is asserted: no OS-enforced shell boundary
      # exists yet outside Windows/WSL, so FF_REQUIRE_BOUNDARY stays empty.
      # When P0-D lands a Linux backend, probe-positive runners will set
      # FF_REQUIRE_BOUNDARY=landlock and boundary tests must run, not skip.
      - name: Capability probe (read-only, never claims isolation)
        shell: bash
        env:
          FF_REQUIRE_BOUNDARY: ""
        run: |
          go test ./internal/sandbox/boundarytest/ -v -count=1

      - name: Spawn-site audit + executor wiring invariants
        shell: bash
        run: |
          go test ./internal/hardening/ -run 'TestSpawnSitesAreAllowlisted|TestBuiltinFallbackIsExplicit' -v -count=1

      # Required-mode wiring check: with FF_REQUIRE_BOUNDARY set, the
      # landlock canary must fail (not skip). If it unexpectedly passes,
      # the fail-closed branch regressed. The output must contain the
      # fail-closed marker so a build breakage (or any other wrong
      # failure) cannot satisfy this step either.
      - name: Required-mode wiring check (expects canary failure)
        shell: bash
        run: |
          set +e
          out=$(FF_REQUIRE_BOUNDARY=landlock go test ./internal/sandbox/boundarytest/ -run 'TestProbeCanarySkipsWithMarker' -count=1 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -eq 0 ]; then
            echo "::error::required boundary unexpectedly passed; fail-closed wiring is broken"
            exit 1
          fi
          case "$out" in
            *"boundary required but unavailable"*) ;;
            *)
              echo "::error::canary failed without the fail-closed marker (build breakage or wrong failure?)"
              exit 1
              ;;
          esac

  coverage:
    name: Coverage gate (cmd)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check cmd coverage >=30%
        shell: bash
        run: |
          go test ./cmd -coverprofile=coverage_cmd.out -covermode=count
          pct=$(go tool cover -func=coverage_cmd.out | awk '/total:/ {print $3}' | tr -d '%')
          echo "cmd coverage: ${pct}%"
          awk -v pct="$pct" 'BEGIN { if (pct+0 < 30) { print "::error::cmd coverage " pct "% is below 30% gate (want >=30%)"; exit 1 } else { print "coverage gate passed" } }'

  cue:
    name: CUE config schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install CUE (latest release)
        shell: bash
        run: |
          CUE_VERSION="$(curl -fsSL https://api.github.com/repos/cue-lang/cue/releases/latest | jq -r .tag_name)"
          echo "Installing cue ${CUE_VERSION}"
          curl -fsSL "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp cue
          sudo install /tmp/cue /usr/local/bin/cue
          cue version

      - name: Self-check schema package
        working-directory: cue
        run: cue vet .

      - name: Validate fixture configs against #Config
        working-directory: cue
        shell: bash
        run: |
          set -e
          for ok in testdata/valid-*.yaml; do
            echo "expecting pass: $ok"
            cue vet . "$ok" -d '#Config' -c
          done

          status=0
          for bad in testdata/invalid-*.yaml; do
            echo "expecting rejection: $bad"
            if cue vet . "$bad" -d '#Config' -c >/dev/null 2>&1; then
              echo "::error file=$bad::invalid config unexpectedly passed the schema"
              status=1
            else
              echo "rejected as expected"
            fi
          done
          exit $status
