name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          # Single source of truth: go.mod pins the toolchain version.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        # The tree is expected to stay gofmt-clean; main.go carries a
        # pre-existing license-comment exception that is excluded here.
        shell: bash
        run: |
          unformatted=$(gofmt -l . | grep -v '^main\.go$' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        # Concurrency-sensitive areas (scheduler, TUI event routing,
        # session/config atomic writes) are covered by race-enabled runs.
        run: go test -race ./...

      - name: Build Forcefield
        run: go build -v ./...

  sandbox-probe:
    name: Sandbox probe • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Read-only capability probe (P0-E): prints kernel/LSM/userns/ABI
      # facts via the boundarytest probe so CI logs show why boundary
      # tests run or skip. The probe never claims isolation; it only
      # reports the machine's Landlock status as landlock=<status> for
      # the steps below to branch on.
      - name: Capability probe (read-only, never claims isolation)
        id: probe
        shell: bash
        env:
          FF_REQUIRE_BOUNDARY: ""
        run: |
          set -o pipefail
          go test ./internal/sandbox/boundarytest/ -v -count=1 2>&1 | tee probe.log
          # No ^ anchor: go test indents logged lines. The trailing $
          # still pins the full token (landlock_abi=/landlock_detail=
          # cannot match, and longer words cannot prefix-match).
          status=$(grep -o -m 1 'landlock=[a-z]*$' probe.log | cut -d= -f2)
          if [ -z "$status" ]; then
            echo "::error::probe output has no parseable landlock status line"
            exit 1
          fi
          echo "landlock=${status}" >> "$GITHUB_OUTPUT"

      - name: Spawn-site audit + executor wiring invariants
        shell: bash
        run: |
          go test ./internal/hardening/ -run 'TestSpawnSitesAreAllowlisted|TestBuiltinFallbackIsExplicit' -v -count=1

      # Landlock available: the boundary test must demonstrate
      # enforcement and exit 0. A skip fails via required mode (no
      # silent skip); a failure means the backend claims enforcement
      # but is broken. Either way the job goes red for the right
      # reason.
      - name: Boundary enforced (Landlock available)
        if: steps.probe.outputs.landlock == 'supported'
        shell: bash
        run: |
          FF_REQUIRE_BOUNDARY=landlock go test ./internal/sandbox/ -run 'TestLandlockBoundaryEnforced' -v -count=1

      # Landlock unavailable: the same required invocation must fail,
      # proving required mode never silently skips. The fail-closed
      # unit tests (backend refuses without Landlock) run in the main
      # matrix; this step only pins the required-mode branch.
      - name: Fail-closed without Landlock (expects required failure)
        if: steps.probe.outputs.landlock != 'supported'
        shell: bash
        run: |
          set +e
          out=$(FF_REQUIRE_BOUNDARY=landlock go test ./internal/sandbox/ -run 'TestLandlockBoundaryEnforced' -count=1 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ $code -eq 0 ]; then
            echo "::error::required boundary unexpectedly passed on a Landlock-less runner"
            exit 1
          fi
          case "$out" in
            *"boundary required but unavailable"*) ;;
            *)
              echo "::error::failure without the required-mode marker (build breakage or wrong failure?)"
              exit 1
              ;;
          esac

  coverage:
    name: Coverage gate (cmd)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check cmd coverage >=30%
        shell: bash
        run: |
          go test ./cmd -coverprofile=coverage_cmd.out -covermode=count
          pct=$(go tool cover -func=coverage_cmd.out | awk '/total:/ {print $3}' | tr -d '%')
          echo "cmd coverage: ${pct}%"
          awk -v pct="$pct" 'BEGIN { if (pct+0 < 30) { print "::error::cmd coverage " pct "% is below 30% gate (want >=30%)"; exit 1 } else { print "coverage gate passed" } }'

  cue:
    name: CUE config schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install CUE (latest release)
        shell: bash
        run: |
          CUE_VERSION="$(curl -fsSL https://api.github.com/repos/cue-lang/cue/releases/latest | jq -r .tag_name)"
          echo "Installing cue ${CUE_VERSION}"
          curl -fsSL "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp cue
          sudo install /tmp/cue /usr/local/bin/cue
          cue version

      - name: Self-check schema package
        working-directory: cue
        run: cue vet .

      - name: Validate fixture configs against #Config
        working-directory: cue
        shell: bash
        run: |
          set -e
          for ok in testdata/valid-*.yaml; do
            echo "expecting pass: $ok"
            cue vet . "$ok" -d '#Config' -c
          done

          status=0
          for bad in testdata/invalid-*.yaml; do
            echo "expecting rejection: $bad"
            if cue vet . "$bad" -d '#Config' -c >/dev/null 2>&1; then
              echo "::error file=$bad::invalid config unexpectedly passed the schema"
              status=1
            else
              echo "rejected as expected"
            fi
          done
          exit $status
