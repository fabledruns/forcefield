name: Scripts

# Installer/uninstaller behavior tests. Deterministic and offline: version
# gates run against locally built stub binaries, never real releases.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "scripts/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: Shell installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check shell syntax
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          sh -n scripts/tests/test-install-sh.sh

      - name: Run installer behavior tests
        run: sh scripts/tests/test-install-sh.sh

  powershell:
    name: PowerShell installer tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        # Needed once: the install-gate test builds a version-stamped
        # ff.exe with the project's own ldflags (no network involved).
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Validate PowerShell syntax (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $files = @('scripts/install.ps1', 'scripts/uninstall.ps1', 'scripts/tests/Test-Installer.ps1', 'scripts/tests/Test-Uninstaller.ps1')
          $failed = $false
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errs)
            if ($errs.Count -ne 0) {
              Write-Host "::error file=$f::PowerShell parse errors:"
              $errs | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "PowerShell 5.1 parse OK"

      - name: Validate PowerShell syntax (PowerShell 7)
        shell: pwsh
        run: |
          $files = @('scripts/install.ps1', 'scripts/uninstall.ps1', 'scripts/tests/Test-Installer.ps1', 'scripts/tests/Test-Uninstaller.ps1')
          $failed = $false
          foreach ($f in $files) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errs)
            if ($errs.Count -ne 0) {
              Write-Host "::error file=$f::PowerShell parse errors:"
              $errs | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "PowerShell 7 parse OK"

      - name: Run installer tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/Test-Installer.ps1

      - name: Run uninstaller tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/tests/Test-Uninstaller.ps1

      - name: Run installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-Installer.ps1

      - name: Run uninstaller tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-Uninstaller.ps1
