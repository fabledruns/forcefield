model:
  provider: local
  name: qwen3-coder

providers:
  ollama:
    type: ollama
    base_url: http://localhost:11434

  openai:
    type: openai
    api_key_env: OPENAI_API_KEY

  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY

  gemini:
    type: gemini

  openrouter:
    type: openai-compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: https://example.com
    models:
      - deepseek/deepseek-chat

  local:
    type: openai-compatible
    base_url: http://localhost:1234/v1
    model: local-model

  custom-header:
    type: openai-compatible
    base_url: http://localhost:8081/v1
    api_path: /v1/custom/chat
    api_key_env: MY_CUSTOM_KEY
    auth_mode: header
    auth_header: X-Custom-Auth
    timeout_seconds: 45
    capabilities:
      streaming: true
      tool_calling: false
    models:
      - custom-model

  llama-cpp:
    type: llama-cpp

  bedrock-example:
    type: bedrock
    region: us-east-1
    profile: work
    models:
      - example-model-id

agent:
  name: default
